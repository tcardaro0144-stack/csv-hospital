<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta
      name="google-site-verification"
      content="ywCbXLQ2XJcVKUaFjmc6fK96eaoD6_53QERVr80vWYA"
    />
    <meta name="author" content="CSV Hospital" />
    <meta
      name="keywords"
      content="CSV Hospital, CSV cleaner, fix CSV, trim CSV, remove empty rows, browser CSV tool, privacy-first data cleaning, CSV guides, fix broken CSV, CSV encoding"
    />

    <title>CSV Hospital — Is Your Data Terminally Messy?</title>
    <meta
      name="description"
      content="CSV Hospital is the digital ER for messy spreadsheets. Admit a CSV in your browser: remove empty rows, trim whitespace, standardize headers, then download a clean file. Privacy-first — your data stays on your device."
    />
    <link rel="canonical" href="https://csvhospital.com/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CSV Hospital" />
    <meta property="og:locale" content="en_US" />
    <meta
      property="og:title"
      content="CSV Hospital — Is Your Data Terminally Messy?"
    />
    <meta
      property="og:description"
      content="CSV Hospital is the digital ER for messy spreadsheets. Admit a CSV in your browser: remove empty rows, trim whitespace, standardize headers, then download a clean file. Privacy-first — your data stays on your device."
    />
    <meta property="og:url" content="https://csvhospital.com/" />
    <meta property="og:image" content="https://csvhospital.com/favicon.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="CSV Hospital — Is Your Data Terminally Messy?"
    />
    <meta
      name="twitter:description"
      content="CSV Hospital is the digital ER for messy spreadsheets. Admit a CSV in your browser: remove empty rows, trim whitespace, standardize headers, then download a clean file. Privacy-first — your data stays on your device."
    />
    <meta name="twitter:image" content="https://csvhospital.com/favicon.svg" />

    <!-- Organization + WebSite structured data (home). Hospital page swaps WebApplication via Seo.jsx -->
    <script type="application/ld+json" id="jsonld-page">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://csvhospital.com/#organization",
            "name": "CSV Hospital",
            "url": "https://csvhospital.com",
            "description": "CSV Hospital — the digital ER for messy spreadsheets. Browser-local CSV triage and repair.",
            "logo": "https://csvhospital.com/favicon.svg"
          },
          {
            "@type": "WebSite",
            "@id": "https://csvhospital.com/#website",
            "url": "https://csvhospital.com",
            "name": "CSV Hospital",
            "publisher": { "@id": "https://csvhospital.com/#organization" },
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "name": "CSV Hospital",
            "url": "https://csvhospital.com/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript. Runs entirely in the browser.",
            "description": "CSV Hospital diagnoses and repairs broken CSV files in your browser: remove empty rows, trim whitespace, standardize headers, then download a clean file.",
            "isAccessibleForFree": true,
            "creator": { "@id": "https://csvhospital.com/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>

    <!--
      Optional Freemius CDN fallback. Primary path: @freemius/checkout via Vite
      (src/utils/freemiusCheckout.js). CDN exposes window.FS if the npm path fails.
    -->
    <script
      id="freemius-checkout-sdk"
      src="https://checkout.freemius.com/js/v1/"
      defer
      onerror="console.warn('[freemius] CDN script failed — npm @freemius/checkout will be used')"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
