# Drop the next high-intent long-tail /guides article from TOPIC_QUEUE.
# Weekly cron + manual dispatch. Output is PR-ready (catalog, body, sitemap).
#
# REQUIRED REPO SETTING (or the "Open pull request" step fails):
#   Settings → Actions → General → Workflow permissions
#   ☑ Allow GitHub Actions to create and approve pull requests
#   https://github.com/tcardaro0144-stack/csv-hospital/settings/actions
#
# Local:
#   npm run guides:list
#   npm run guides:next

name: Content flywheel

on:
  schedule:
    # Mondays 09:00 UTC — next unpublished long-tail wrangling guide
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      slug:
        description: Optional topic slug (leave empty to publish the next queued topic)
        required: false
        type: string
      dry_run:
        description: Preview only (no files written, no PR)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history helps create-pull-request compute diffs reliably
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install npm dependencies
        run: npm ci

      - name: List topic queue
        run: python scripts/content_flywheel.py --list

      - name: Run content flywheel
        id: flywheel
        env:
          # workflow_dispatch inputs are empty on schedule — treat as unset
          FLYWHEEL_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.slug || '' }}
          FLYWHEEL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "${FLYWHEEL_DRY_RUN}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "${FLYWHEEL_SLUG}" ]; then
            ARGS+=(--slug "${FLYWHEEL_SLUG}")
          fi
          python scripts/content_flywheel.py "${ARGS[@]}"

      - name: Open pull request
        id: cpr
        if: ${{ steps.flywheel.outputs.skipped != 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run == true) }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "content: drop ${{ steps.flywheel.outputs.slug || 'next evergreen guide' }}"
          branch: content/flywheel-guide
          delete-branch: true
          title: "content: ${{ steps.flywheel.outputs.slug || 'next CSV Hospital guide' }}"
          body: |
            Automated high-intent long-tail guide from `scripts/content_flywheel.py`.

            - Slug: `${{ steps.flywheel.outputs.slug }}`
            - Guide body under `src/content/guides/`
            - Catalog entry in `shared/guidesCatalog.js`
            - Body registry update in `src/content/guides/index.js`
            - Regenerated `public/sitemap.xml`

            No manual formatting required — merge when ready and deploy as usual.
          add-paths: |
            shared/guidesCatalog.js
            src/content/guides/
            public/sitemap.xml

      - name: Fail clearly if Actions cannot open PRs
        if: ${{ steps.cpr.outcome == 'failure' }}
        run: |
          set -euo pipefail
          echo "::error title=Actions cannot create pull requests::Enable Settings → Actions → General → Workflow permissions → Allow GitHub Actions to create and approve pull requests"
          echo "Repo settings: https://github.com/${{ github.repository }}/settings/actions"
          echo "Branch with guide changes (if pushed): content/flywheel-guide"
          echo "Open a PR manually: https://github.com/${{ github.repository }}/compare/main...content/flywheel-guide?quick_pull=1"
          exit 1
